name: CI

on:
  push:
    branches: [main, development, master]
  pull_request:
    branches: [main, development, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Install dependencies
        run: poetry install --with dev

      - name: Poetry check
        run: poetry check

      - name: Ruff
        run: poetry run ruff check katabatic tests

      - name: Pytest (fast)
        run: poetry run pytest -q

      - name: Build wheel
        run: poetry build

  integration-ganblr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Install with ganblr extra
        run: poetry install --with dev -E ganblr

      - name: Integration tests (GANBLR)
        run: poetry run pytest -m "integration and ganblr" -q

  integration-great:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Install with great extra
        run: poetry install --with dev -E great

      - name: Integration tests (GReaT)
        run: poetry run pytest -m "integration and great" -q

  wheel-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry and build
        run: |
          pip install poetry==1.8.5
          poetry build

      - name: Install wheel in clean venv
        run: |
          ls -la dist/
          python -m venv /tmp/whltest
          /tmp/whltest/bin/pip install dist/katabatic-*.whl
          /tmp/whltest/bin/python -c "import katabatic; from katabatic.utils.preprocess import preprocess_tabular; print(katabatic.__version__)"
