name: CI

on:
  push:
    branches: [main, development]
    paths-ignore:
      - 'frontend/**' #TODO: To be removed once front-end moved to its own repo.
  pull_request:
    branches: [main, development]
    paths-ignore:
      - 'frontend/**' #TODO: To be removed once front-end moved to its own repo.

permissions:
  contents: read

env:
  POETRY_VERSION: "2.4.3"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install poetry==${{ env.POETRY_VERSION }} pre-commit
      - run: poetry install --with dev
      - run: pre-commit run --all-files

  lint-and-test:
    needs: changes
    # Always runs for main (release pushes/PRs), regardless of what has changed.
    if: >
      needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true' ||
      github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache Poetry environment
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-lint-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Validate project + lock in sync
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --with dev

      - name: Ruff
        run: poetry run ruff check --no-cache katabatic tests

      - name: Bandit (Security)
        run: poetry run bandit -r katabatic -ll

      - name: pip-audit (Security)
        run: |
          poetry run pip freeze --exclude-editable > ci-audit-reqs.txt
          poetry run pip-audit -r ci-audit-reqs.txt -s osv

      - name: Pytest (fast)
        env:
          COVERAGE_FILE: .coverage.core
        run: poetry run pytest -q --deselect tests/test_model_registry.py::test_model_promotion_contract --cov=katabatic --cov-report=term-missing

      - name: Upload Core Coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core
          path: .coverage.core
          include-hidden-files: true

      - name: Core coverage floor
        env:
          COVERAGE_FILE: .coverage.core
        run: |
          poetry run coverage report --include="katabatic/pipeline/*,katabatic/utils/*,katabatic/datasets/*,katabatic/artifacts/*,katabatic/evaluate/*,katabatic/models/registry.py,katabatic/models/base_model.py" --fail-under=70

      - name: Build wheel
        run: poetry build

  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      core: ${{ steps.filter.outputs.core }}
      python: ${{ steps.filter.outputs.python }}
      docker: ${{ steps.filter.outputs.docker }}
      scripts: ${{ steps.filter.outputs.scripts }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ci:
              - '.github/workflows/**'
            python:
              - 'katabatic/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'poetry.lock'
              - '.pre-commit-config.yaml'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'katabatic/**'
              - 'pyproject.toml'
              - 'poetry.lock'
            scripts:
              - 'scripts/**'
              - 'pyproject.toml'
              - 'poetry.lock'
            core:
              - 'pyproject.toml'
              - 'poetry.lock'
              - 'katabatic/pipeline/**'
              - 'katabatic/utils/**'
              - 'katabatic/datasets/**'
              - 'katabatic/artifacts/**'
              - 'katabatic/evaluate/**'
              - 'katabatic/models/registry.py'
              - 'katabatic/models/base_model.py'
            ganblr:
              - 'katabatic/models/ganblr/**'
              - 'tests/test_integration_ganblr.py'
            ctgan:
              - 'katabatic/models/ctgan/**'
              - 'tests/test_integration_ctgan.py'
            pategan:
              - 'katabatic/models/pategan/**'
              - 'tests/test_integration_pategan.py'
            tabsyn:
              - 'katabatic/models/tabsyn/**'
              - 'tests/test_integration_tabsyn.py'
            great:
              - 'katabatic/models/great/**'
              - 'tests/test_integration_great.py'
            smote:
              - 'katabatic/models/smote/**'
              - 'tests/test_integration_smote.py'
            mst:
              - 'katabatic/models/mst/**'
              - 'tests/test_integration_mst.py'
            privtree:
              - 'katabatic/models/privtree/**'
              - 'tests/test_integration_privtree.py'
            arf:
              - 'katabatic/models/arf/**'
              - 'tests/test_integration_arf.py'
            synthpop:
              - 'katabatic/models/synthpop/**'
              - 'tests/test_integration_synthpop.py'
            naivebayes:
              - 'katabatic/models/naivebayes/**'
              - 'tests/test_integration_naivebayes.py'
            histogram:
              - 'katabatic/models/histogram/**'
              - 'tests/test_integration_histogram.py'
            tabebm:
              - 'katabatic/models/tabebm/**'
              - 'tests/test_integration_tabebm.py'
            realtabformer:
              - 'katabatic/models/realtabformer/**'
              - 'tests/test_integration_realtabformer.py'
            kde:
              - 'katabatic/models/kde/**'
              - 'tests/test_integration_kde.py'

      - name: Build Dynamic Matrix
        id: build-matrix
        run: |
          ALL_MODELS='[
            {"model": "arf", "torch": false},
            {"model": "ctgan", "torch": true},
            {"model": "ganblr", "torch": false},
            {"model": "great", "torch": true},
            {"model": "histogram", "torch": false},
            {"model": "kde", "torch": false},
            {"model": "mst", "torch": false},
            {"model": "naivebayes", "torch": false},
            {"model": "pategan", "torch": false},
            {"model": "privtree", "torch": false},
            {"model": "realtabformer", "torch": true},
            {"model": "smote", "torch": false},
            {"model": "synthpop", "torch": false, "r": true},
            {"model": "tabebm", "torch": true},
            {"model": "tabsyn", "torch": true}
          ]'

          # Always run the full matrix for main (release pushes/PRs) so
          # integration-<model> is safe to require there, or if a core file changed.
          if [ "${{ steps.filter.outputs.core }}" == "true" ] || \
             [ "${{ github.base_ref }}" == "main" ] || \
             [ "${{ github.ref }}" == "refs/heads/main" ]; then
            MATRIX=$(echo "$ALL_MODELS" | jq -c '.')
          else
            # Otherwise, append only the models that changed.
            CHANGED='${{ steps.filter.outputs.changes }}'
            MATRIX=$(echo "$ALL_MODELS" | jq -c --argjson changed "$CHANGED" \
              '[.[] | select(.model as $m | $changed | index($m))]')
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  integration:
    needs: [lint-and-test, changes]
    if: ${{ needs.changes.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    name: integration-${{ matrix.model }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache Poetry environment
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ matrix.model }}-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Cache R library
        if: matrix.r
        uses: actions/cache@v6
        with:
          path: /usr/lib/R/site-library
          key: r-synthpop-${{ runner.os }}

      - name: Install R and the synthpop package
        if: matrix.r
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base
          sudo Rscript -e "if (!requireNamespace('synthpop', quietly = TRUE)) install.packages('synthpop', repos='https://cloud.r-project.org/')"

      - name: Pre-install CPU torch
        if: matrix.torch
        run: poetry run pip install "torch>=2.13.0,<3.0.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Install with ${{ matrix.model }} extra
        run: poetry install --with dev -E ${{ matrix.model }}

      - name: Remove triton
        if: matrix.torch
        # Triton segfaults on CPU version of torch. Removes if in pipeline.
        run: poetry run pip uninstall -y triton

      - name: Integration tests (${{ matrix.model }})
        env:
          COVERAGE_FILE: .coverage.${{ matrix.model }}
        run: poetry run pytest tests/test_integration_${{ matrix.model }}.py -q --cov=katabatic --cov-report=

      - name: Model promotion contract (${{ matrix.model }})
        run: poetry run pytest tests/test_model_registry.py -k "${{ matrix.model }}" -v

      - name: Model coverage report (${{ matrix.model }})
        env:
          COVERAGE_FILE: .coverage.${{ matrix.model }}
        run: poetry run coverage report --include="katabatic/models/${{ matrix.model }}/*"

      - name: Upload Model Coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.model }}
          path: .coverage.${{ matrix.model }}
          include-hidden-files: true

  setup-script:
    # Verifies scripts/setup.py works on Linux, MacOS, and Windows.
    needs: changes
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/development' &&
      (needs.changes.outputs.scripts == 'true' || needs.changes.outputs.ci == 'true')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: setup-script-${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache Poetry environment
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ matrix.model }}-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Run setup script
        run: python scripts/setup.py

      - name: Verify the package imports
        run: poetry run python -c "import katabatic; print(katabatic.__version__)"

  wheel-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry and build
        run: |
          pip install poetry==${{ env.POETRY_VERSION }}
          poetry build

      - name: Install wheel in clean venv
        run: |
          python -m venv /tmp/whltest
          /tmp/whltest/bin/pip install dist/*.whl
          /tmp/whltest/bin/python -c "import katabatic, tomllib; \
            expected = tomllib.load(open('pyproject.toml','rb'))['project']['version']; \
            assert katabatic.__version__ == expected, f'{katabatic.__version__} != {expected}'"

  docker-build:
    needs: changes
    # Always runs for main (release pushes/PRs). Required on protect_main.
    if: >
      needs.changes.outputs.docker == 'true' || needs.changes.outputs.ci == 'true' ||
      github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build base image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: katabatic:base
          build-args: |
            POETRY_INSTALL_ARGS=--only main
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Smoke test image
        run: |
          docker run --rm katabatic:base python -c "import katabatic; print(katabatic.__version__)"

  merge-coverage:
    runs-on: ubuntu-latest
    needs: [lint-and-test, integration, changes]
    if: >
      always() &&
      needs.lint-and-test.result == 'success' &&
      needs.changes.outputs.python == 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Coverage tool
        run: pip install coverage==7.4.0

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine and Report
        env:
          FULL_MATRIX: >-
            ${{ needs.changes.outputs.core == 'true' ||
                github.base_ref == 'main' || github.ref == 'refs/heads/main' }}
        run: |
          coverage combine
          if [ "$FULL_MATRIX" == "true" ]; then
            coverage report --show-missing --fail-under=45
          else
            coverage report --show-missing
          fi
