name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache Poetry environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-lint-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        run: pip install poetry==2.4.1

      - name: Validate project + lock in sync
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --with dev

      - name: Ruff
        run: poetry run ruff check katabatic tests

      - name: Pytest (fast)
        run: poetry run pytest -q

      - name: Build wheel
        run: poetry build

  integration-ganblr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache Poetry environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-ganblr-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        run: pip install poetry==2.4.1

      - name: Install with ganblr extra
        run: poetry install --with dev -E ganblr

      - name: Integration tests (GANBLR)
        run: poetry run pytest -m "integration and ganblr" -q

  integration-great:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache Poetry environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-great-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        run: pip install poetry==2.4.1

      - name: Install with great extra
        run: poetry install --with dev -E great

      - name: Integration tests (GReaT)
        run: poetry run pytest -m "integration and great" -q

  wheel-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry and build
        run: |
          pip install poetry==2.4.1
          poetry build

      - name: Install wheel in clean venv
        run: |
          python -m venv /tmp/whltest
          /tmp/whltest/bin/pip install dist/*.whl
          /tmp/whltest/bin/python -c "import katabatic; print(katabatic.__version__)"
  
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { tag: "base",   args: "--only main" }
          - { tag: "ganblr", args: "--only main -E ganblr" }
          - { tag: "great",  args: "--only main -E great" }
    name: docker-build-${{ matrix.variant.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (${{ matrix.variant.tag }})
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: katabatic:${{ matrix.variant.tag }}
          build-args: |
            POETRY_INSTALL_ARGS=${{ matrix.variant.args }}
          cache-from: type=gha,scope=${{ matrix.variant.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.tag }}

      - name: Smoke test (${{ matrix.variant.tag }})
        run: |
          docker run --rm katabatic:${{ matrix.variant.tag }} python -c "
          import katabatic
          from katabatic.utils.registry import ModelRegistry
          print('Katabatic OK:', katabatic.__version__)
          "
