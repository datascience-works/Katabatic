# Publish katabatic to PyPI (production).
#
# Authentication: currently the PYPI_API_TOKEN repo secret. To switch to Trusted Publishing
# (https://docs.pypi.org/trusted-publishers/), a PyPI project owner adds a trusted publisher
# (owner: datascience-works, repo: Katabatic, workflow: publish-pypi.yml, environment: pypi);
# then remove the password line in the publish step.
#
# Triggers:
#   - GitHub Release published (recommended): create release from tag v1.2.3
#   - Manual: Actions → Publish to PyPI → Run workflow
#
# Only "release: published" triggers a real publish. Do NOT also trigger on tag
# push: creating a GitHub Release from a tag fires both events almost
# simultaneously, so both would build and try to upload the same version -
# only the first can succeed, since PyPI rejects re-uploading an existing
# version/filename even from a legitimate rebuild.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:


concurrency:
  group: publish-pypi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  POETRY_VERSION: "2.4.3"

jobs:
  publish:
    name: Build and upload to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(poetry version --short)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match pyproject.toml version $version (expected v$version)."
            exit 1
          fi

      - name: Validate project metadata
        run: poetry check

      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}  # remove to use Trusted Publishing. Must be configured on PyPI.
