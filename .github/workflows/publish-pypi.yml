# Publish katabatic to PyPI (production).
#
# Setup (choose one):
#   Trusted publishing (recommended): https://docs.pypi.org/trusted-publishers/
#     - PyPI project → Publishing → Add trusted publisher
#     - Owner: datascience-works, repo: Katabatic, workflow: publish-pypi.yml
#     - Environment name: pypi (create in GitHub repo Settings → Environments)
#   API token: add repo secret PYPI_API_TOKEN (uncomment password in publish step)
#
# Triggers:
#   - GitHub Release published (recommended): create release from tag v1.2.3
#   - Manual: Actions → Publish to PyPI → Run workflow
#
# Only "release: published" triggers a real publish. Do NOT also trigger on tag
# push: creating a GitHub Release from a tag fires both events almost
# simultaneously, so both would build and try to upload the same version -
# only the first can succeed, since PyPI rejects re-uploading an existing
# version/filename even from a legitimate rebuild.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-pypi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and upload to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==2.4.2

      - name: Validate project metadata
        run: poetry check

      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}  # if not using trusted publishing
