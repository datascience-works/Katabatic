# Publish katabatic to TestPyPI.
#
# Setup (choose one):
#   Trusted publishing (recommended): https://docs.pypi.org/trusted-publishers/
#     - TestPyPI project → Publishing → Add trusted publisher
#     - Owner: datascience-works, repo: Katabatic, workflow: publish-testpypi.yml
#     - Environment name: testpypi (create in GitHub repo Settings → Environments)
#   API token: add repo secret TEST_PYPI_API_TOKEN (uncomment password in publish step)
#
# Triggers:
#   - Manual: Actions → Publish to TestPyPI → Run workflow
#   - Tags: v1.2.3-rc1, v1.2.3-test.1 (pre-release / test uploads)

name: Publish to TestPyPI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-rc*"
      - "v*-test*"
      - "v*.*.*a*"
      - "v*.*.*b*"

concurrency:
  group: publish-testpypi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and upload to TestPyPI
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==2.4.1

      - name: Validate project metadata
        run: poetry check

      - name: Build package
        run: poetry build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          # password: ${{ secrets.TEST_PYPI_API_TOKEN }}  # if not using trusted publishing
