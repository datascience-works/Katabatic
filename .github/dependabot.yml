version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "bandit"
          - "pip-audit"
          - "pre-commit"
          - "ipykernel"
      ml-stack:
        patterns:
          - "torch"
          - "tensorflow*"
          - "transformers"
          - "keras*"
          - "accelerate"
          - "datasets"
          - "huggingface-hub"
          - "fsspec"
          - "pgmpy"
          - "xgboost"
      privacy-stack:
        patterns:
          - "smartnoise-synth"
          - "opendp"
          - "private-pgm"
      core:
        patterns:
          - "pandas"
          - "numpy"
          - "scipy"
          - "scikit-learn"
          - "psutil"
      # Catches everything not claimed by a group above.
      misc:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "pre-commit"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
