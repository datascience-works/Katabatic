version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      dev-tooling:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "bandit"
          - "pip-audit"
          - "pre-commit"
          - "ipykernel"
      ml-stack:
        patterns:
          - "torch"
          - "tensorflow*"
          - "transformers"
          - "keras*"
          - "accelerate"
          - "datasets"
          - "pgmpy"
          - "xgboost"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
