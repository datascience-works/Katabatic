[project]
name = "katabatic"
version = "0.3.1"
description = "Framework for synthetic tabular data generation, evaluation, and artifact-based pipelines."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vikum Dabare", email = "vikumdabare@gmail.com"},
    { name = "Alex Ryan", email = "alex.ryan_14@outlook.com" },
]
keywords = ["synthetic-data", "tabular-data", "generative-models", "GAN", "TSTR"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11,<3.12"

# Core dependencies - always installed
dependencies = [
    "pandas>=2.3.1,<3.0.0",
    "scikit-learn>=1.9.1,<2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.13.0,<1.15.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
codi = ["torch>=2.14.0,<3.0.0"]
arf = []
ctgan = ["torch>=2.14.0,<3.0.0"]
ganblr = [
    "tensorflow==2.21.*",
    "tensorflow-io==0.37.1",
    "pgmpy>=0.1.25",
    "pyitlib==0.3.1",
]
great = [
    "transformers>=5.0.0,<6.0.0",
    "huggingface-hub>=1.3.0,<2.0",
    "torch>=2.14.0,<3.0.0",
    "datasets>=5.0.1,<6.0.0",
    "accelerate>=1.15.0",
    "fsspec>=2023.5.0,<=2026.2.0",
]
realtabformer = [
    "realtabformer==0.2.4",
    "transformers>=5.0.0,<6.0.0",
]
medgan = ["torch>=2.14.0,<3.0.0"]
naivebayes = []
pategan = [
    "tensorflow==2.21.*",
    "tensorflow-io==0.37.1",
]
privtree = []
smote = ["imbalanced-learn==0.14.2"]
mst = [
    "smartnoise-synth==1.0.5",
    "opendp>=0.14.1,<0.15",
    "private-pgm @ git+https://github.com/ryan112358/private-pgm.git@01f02f17eba440f4e76c1d06fa5ee9eed0bd2bca",
]
tabddpm = [
    "torch>=2.14.0,<3.0.0",
    "rtdl_revisiting_models==0.0.2",
    "category-encoders>=2.11.1,<3.0.0",
]
tabsyn = [
    "torch>=2.14.0,<3.0.0",
    "tqdm>=4.70.1,<5.0.0",
    "category-encoders>=2.11.1,<3.0.0",
    "tomli>=2.0.1,<3.0.0",
    "tomli-w>=1.0.0,<2.0.0",
]
eval = ["xgboost>=3.2.0,<4.0.0"]
all = [
    "tensorflow==2.21.*",
    "tensorflow-io==0.37.1",
    "pgmpy>=0.1.25",
    "pyitlib==0.3.1",
    "statsmodels>=0.14.4,<0.15.0",
    "realtabformer==0.2.4",
    "tqdm>=4.66.0,<5.0.0",
    "imbalanced-learn==0.14.2",
    "transformers>=5.0.0,<6.0.0",
    "huggingface-hub>=1.3.0,<2.0",
    "torch>=2.14.0,<3.0.0",
    "datasets>=5.0.1,<6.0.0",
    "xgboost>=3.2.0,<4.0.0",
    "tqdm>=4.70.1,<5.0.0",
    "tomli>=2.0.1,<3.0.0",
    "tomli-w>=1.0.0,<2.0.0",
    "category-encoders>=2.11.1,<3.0.0",
    "rtdl_revisiting_models==0.0.2",
    "accelerate>=1.15.0",
    "fsspec>=2023.5.0,<=2026.2.0",
]

[project.urls]
Homepage = "https://github.com/datascience-works/Katabatic"
Repository = "https://github.com/datascience-works/Katabatic"
Documentation = "https://github.com/datascience-works/Katabatic#readme"
"Bug Tracker" = "https://github.com/datascience-works/Katabatic/issues"

[tool.coverage.run]
# Experimental models are excluded until they have integration tests.
omit = [
    "katabatic/models/codi/*",
    "katabatic/models/gmm/*",
    "katabatic/models/medgan/*",
    "katabatic/models/synthpop/*",
    "katabatic/models/tabddpm/*",
    "katabatic/models/realtabformer/*",
    "katabatic/models/tabkde_updated/*",
    "katabatic/models/tvaegan/*",

]

[tool.poetry]
# Poetry-specific build config only.
packages = [{ include = "katabatic" }]
include = ["CHANGELOG.md"]

[tool.poetry.group.dev.dependencies]
mypy = "^2.3.1"
ruff = "^0.16.7"
# Development / test tooling
ipykernel = "^7.3.0"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-mock = "^3.15.1"
pytest-forked = "^1.7.5"
# Security tools
bandit = "^1.9.4"
pip-audit = "^2.10.1"
pre-commit = "^4.6.2"

[tool.pytest.ini_options]
markers = [
    "integration: full model stack (slow)",
    "ganblr: requires ganblr extra",
    "great: requires great extra",
    "ctgan: requires ctgan extra",
    "pategan: requires pategan extra",
    "tabsyn: requires tabsyn extra",
    "smote: requires smote extra",
    "mst: requires mst extra",
    "privtree: requires privtree extra",
    "arf: requires arf extra",
    "naivebayes: requires naivebayes extra",
    "forked: run test in an isolated forked process (pytest-forked)",
]

[tool.ruff]
extend-exclude = ["**/*.md", "**/README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"] #E: pycodestyle error, F: flake8 error, I: isort imports, UP: Upgrade syntax
ignore = ["E501"] #line-too-long. Currently prevents PRs. More effort required to fix across codebase.

#separates directories like katabatic/datasets/ from HuggingFace datasets/ for isort.
[tool.ruff.lint.isort]
known-third-party = ["datasets"]
known-first-party = ["katabatic"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
