[tool.poetry]
name = "katabatic"
version = "0.1.0a1"
description = "Framework for synthetic tabular data generation, evaluation, and artifact-based pipelines."
authors = ["Vikum Dabare <vikumdabare@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["synthetic-data", "tabular-data", "generative-models", "GAN", "TSTR"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{ include = "katabatic" }]
include = ["CHANGELOG.md", "LICENSE"]

[tool.poetry.urls]
Homepage = "https://github.com/datascience-works/Katabatic"
Repository = "https://github.com/datascience-works/Katabatic"
Documentation = "https://github.com/datascience-works/Katabatic#readme"
"Bug Tracker" = "https://github.com/datascience-works/Katabatic/issues"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"

# Core dependencies - always installed
pandas = "^2.3.1"
scikit-learn = "^1.3.0"
numpy = "^1.24.0"
scipy = "^1.13.0,<1.15.0"
psutil = ">=5.9"
accelerate = ">=0.26.0"

# Optional dependencies for specific models
tensorflow = {version = "==2.19.*", optional = true}
tensorflow-io = {version = "0.31.0", optional = true}
pgmpy = {version = ">=0.1.25", optional = true}
pyitlib = {version = "0.3.1", optional = true}
tf-keras = {version = "^2.19.0", optional = true}
statsmodels = {version = "^0.14.4", optional = true}
transformers = {version = "^4.53.2", optional = true}
torch = {version = "^2.7.1", optional = true}
datasets = {version = "^4.0.0", optional = true}
xgboost = {version = "^3.0.2", optional = true}

# --- TabSyn-specific optional deps ---
tqdm = {version = "^4.66.0", optional = true}
tomli = {version = "^2.0.1", optional = true}
tomli-w = {version = "^1.0.0", optional = true}
# === Added for TabDDPM / modern RTDL stack ===
category-encoders = {version = "^2.8.1", optional = true}
rtdl_revisiting_models = {version = "0.0.2", optional = true}
tabpfn = {version = ">=2.0", optional = true}

[tool.poetry.extras]
codi = ["torch"]
ctgan = ["torch"]
ganblr = ["tensorflow", "tensorflow-io", "pgmpy", "pyitlib", "tf-keras"]
great = ["transformers", "torch", "datasets"]
medgan = ["torch"]
pategan = ["tensorflow", "tensorflow-io"]
tabddpm = ["torch", "rtdl_revisiting_models", "category-encoders"]
tabpfgen = ["torch", "tabpfn"]
tabsyn = ["torch", "tqdm", "category-encoders", "tomli", "tomli-w"]

eval = ["xgboost"]

# Keep "all" in sync with every optional dependency above
all = [
  "tensorflow",
  "tensorflow-io",
  "pgmpy",
  "pyitlib",
  "tf-keras",
  "statsmodels",
  "transformers",
  "torch",
  "datasets",
  "xgboost",
  "tqdm",
  "tomli",
  "tomli-w",
  "category-encoders",
  "rtdl_revisiting_models",
  "tabpfn",
]

[tool.poetry.group.dev.dependencies]
autopep8 = "^2.0.0"
isort = "^5.12.0"
mypy = "^1.5.0"
ruff = "^0.12.4"
# Development / test tooling
ipykernel = "^6.29.5"
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
