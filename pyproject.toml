[project]
name = "katabatic"
version = "1.0.0rc1"
description = "Framework for synthetic tabular data generation, evaluation, and artifact-based pipelines."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vikum Dabare", email = "vikumdabare@gmail.com"},
    { name = "Alex Ryan", email = "alex.ryan_14@outlook.com" },
]
keywords = ["synthetic-data", "tabular-data", "generative-models", "GAN", "TSTR"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11,<3.12"

# Core dependencies - always installed
dependencies = [
    "pandas>=2.3.1,<3.0.0",
    "scikit-learn>=1.9.1,<2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.13.0,<1.15.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
codi = ["torch>=2.14.0,<3.0.0"]
arf = []
# Remote artifact stores: combine extras for several clouds, e.g. [artifacts-s3,artifacts-gcs].
artifacts-s3 = ["fsspec>=2023.5.0,<=2026.2.0", "s3fs>=2023.5.0,<=2026.2.0"]
artifacts-gcs = ["fsspec>=2023.5.0,<=2026.2.0", "gcsfs>=2023.5.0,<=2026.2.0"]
artifacts-azure = ["fsspec>=2023.5.0,<=2026.2.0", "adlfs>=2023.5.0,<=2026.2.0"]
kde = []
ctgan = ["torch>=2.14.0,<3.0.0"]
ganblr = [
    "tensorflow==2.21.*",
    "tensorflow-io==0.37.1",
    "pgmpy>=0.1.25",
    "pyitlib==0.3.1",
]
great = [
    "transformers>=5.0.0,<6.0.0",
    "huggingface-hub>=1.3.0,<2.0",
    "torch>=2.14.0,<3.0.0",
    "datasets>=5.0.1,<6.0.0",
    "accelerate>=1.15.0",
    "fsspec>=2023.5.0,<=2026.2.0",
]
histogram = []
fairtabdiffusion = ["torch>=2.14.0,<3.0.0"]
realtabformer = [
    "realtabformer==0.2.4",
    "transformers>=5.0.0,<6.0.0",
    "torch>=2.14.0,<3.0.0",
]
medgan = ["torch>=2.14.0,<3.0.0"]
naivebayes = []
pategan = [
    "tensorflow==2.21.*",
    "tensorflow-io==0.37.1",
]
privtree = []
smote = ["imbalanced-learn==0.14.2"]
tabebm = []
synthpop = []
# MST requires private-pgm, which isn't on PyPI. See the optional "mst" Poetry group below.
mst = [
    "smartnoise-synth==1.0.5",
    "opendp>=0.14.1,<0.15",
]
tabddpm = [
    "torch>=2.14.0,<3.0.0",
    "rtdl_revisiting_models==0.0.2",
    "category-encoders>=2.11.1,<3.0.0",
]
tabsyn = [
    "torch>=2.14.0,<3.0.0",
    "tqdm>=4.70.1,<5.0.0",
    "category-encoders>=2.11.1,<3.0.0",
    "tomli>=2.0.1,<3.0.0",
    "tomli-w>=1.0.0,<2.0.0",
]
eval = ["xgboost>=3.2.0,<4.0.0"]

[project.urls]
Homepage = "https://github.com/datascience-works/Katabatic"
Repository = "https://github.com/datascience-works/Katabatic"
Documentation = "https://github.com/datascience-works/Katabatic#readme"
"Bug Tracker" = "https://github.com/datascience-works/Katabatic/issues"

[tool.coverage.run]
# Experimental code has no coverage requirement until it is promoted.
omit = ["katabatic/experimental/*"]

[tool.poetry]
# Poetry-specific build config only.
packages = [{ include = "katabatic" }]
include = ["CHANGELOG.md"]

[tool.poetry.group.dev.dependencies]
mypy = "^2.3.1"
ruff = "^0.16.7"
# Development / test tooling
ipykernel = "^7.3.0"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-mock = "^3.15.1"
pytest-forked = "^1.7.5"
# Executes examples/*.ipynb in tests/test_examples.py
nbclient = "^0.11.0"
nbformat = "^5.11.1"
fsspec = ">=2023.5.0,<=2026.2.0"
# Security tools
bandit = "^1.9.4"
pip-audit = "^2.10.1"
pre-commit = "^4.6.2"

# private-pgm for the mst extra as PyPI rejects packages with Git dependencies.
# install with `poetry install -E mst --with mst`.
[tool.poetry.group.mst]
optional = true

[tool.poetry.group.mst.dependencies]
private-pgm = { git = "https://github.com/ryan112358/private-pgm.git", rev = "01f02f17eba440f4e76c1d06fa5ee9eed0bd2bca" }

[tool.pytest.ini_options]
markers = [
    "arf: requires arf extra",
    "artifacts_remote: requires fsspec (memory:// backend, no cloud creds needed)",
    "ctgan: requires ctgan extra",
    "fairtabdiffusion: requires fairtabdiffusion extra",
    "forked: run test in an isolated forked process (pytest-forked)",
    "ganblr: requires ganblr extra",
    "great: requires great extra",
    "histogram: requires histogram extra",
    "integration: full model stack (slow)",
    "kde: core deps only, no extra required",
    "mst: requires mst extra",
    "naivebayes: requires naivebayes extra",
    "pategan: requires pategan extra",
    "privtree: requires privtree extra",
    "realtabformer: requires realtabformer extra",
    "smote: requires smote extra",
    "synthpop: requires synthpop extra (and R + CRAN synthpop packages)",
    "tabebm: requires tabebm extra",
    "tabsyn: requires tabsyn extra",
]

[tool.ruff]
extend-exclude = ["**/*.md", "**/README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"] #E: pycodestyle error, F: flake8 error, I: isort imports, UP: Upgrade syntax
ignore = ["E501"] #line-too-long. Currently prevents PRs. More effort required to fix across codebase.

#separates directories like katabatic/datasets/ from HuggingFace datasets/ for isort.
[tool.ruff.lint.isort]
known-third-party = ["datasets"]
known-first-party = ["katabatic"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
