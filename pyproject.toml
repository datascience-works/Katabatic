[project]
name = "katabatic"
version = "0.1.0a1"
description = "Framework for synthetic tabular data generation, evaluation, and artifact-based pipelines."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vikum Dabare", email = "vikumdabare@gmail.com" },
]
keywords = ["synthetic-data", "tabular-data", "generative-models", "GAN", "TSTR"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11,<3.12"

# Core dependencies - always installed
dependencies = [
    "pandas>=2.3.1,<3.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.13.0,<1.15.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
codi = ["torch>=2.7.1,<3.0.0"]
ctgan = ["torch>=2.7.1,<3.0.0"]
ganblr = [
    "tensorflow==2.19.*",
    "tensorflow-io==0.31.0",
    "pgmpy>=0.1.25",
    "pyitlib==0.3.1",
    "tf-keras>=2.19.0,<3.0.0",
]
great = [
    "transformers>=4.53.2,<5.0.0",
    "torch>=2.7.1,<3.0.0",
    "datasets>=4.0.0,<5.0.0",
    "accelerate>=0.26.0",
]
medgan = ["torch>=2.7.1,<3.0.0"]
pategan = [
    "tensorflow==2.19.*",
    "tensorflow-io==0.31.0",
]
tabddpm = [
    "torch>=2.7.1,<3.0.0",
    "rtdl_revisiting_models==0.0.2",
    "category-encoders>=2.8.1,<3.0.0",
]
tabpfgen = [
    "torch>=2.7.1,<3.0.0",
    "tabpfn>=2.0",
]
tabsyn = [
    "torch>=2.7.1,<3.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "category-encoders>=2.8.1,<3.0.0",
    "tomli>=2.0.1,<3.0.0",
    "tomli-w>=1.0.0,<2.0.0",
]
eval = ["xgboost>=3.0.2,<4.0.0"]
all = [
    "tensorflow==2.19.*",
    "tensorflow-io==0.31.0",
    "pgmpy>=0.1.25",
    "pyitlib==0.3.1",
    "tf-keras>=2.19.0,<3.0.0",
    "statsmodels>=0.14.4,<0.15.0",
    "transformers>=4.53.2,<5.0.0",
    "torch>=2.7.1,<3.0.0",
    "datasets>=4.0.0,<5.0.0",
    "xgboost>=3.0.2,<4.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "tomli>=2.0.1,<3.0.0",
    "tomli-w>=1.0.0,<2.0.0",
    "category-encoders>=2.8.1,<3.0.0",
    "rtdl_revisiting_models==0.0.2",
    "tabpfn>=2.0",
    "accelerate>=0.26.0",
]

[project.urls]
Homepage = "https://github.com/datascience-works/Katabatic"
Repository = "https://github.com/datascience-works/Katabatic"
Documentation = "https://github.com/datascience-works/Katabatic#readme"
"Bug Tracker" = "https://github.com/datascience-works/Katabatic/issues"

[tool.coverage.run]
# Experimental models are excluded until they have integration tests.
omit = [
    "katabatic/models/codi/*",
    "katabatic/models/ctgan/*",
    "katabatic/models/medgan/*",
    "katabatic/models/pategan/*",
    "katabatic/models/tabddpm/*",
    "katabatic/models/tabsyn/*",
    "katabatic/cli/*",
]

[tool.poetry]
# Poetry-specific build config only.
packages = [{ include = "katabatic" }]
include = ["CHANGELOG.md"]

[tool.poetry.group.dev.dependencies]
mypy = "^1.5.0"
ruff = "^0.12.4"
# Development / test tooling
ipykernel = "^6.29.5"
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"

[tool.pytest.ini_options]
markers = [
    "integration: full model stack (slow)",
    "ganblr: requires ganblr extra",
    "great: requires great extra",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"] #E: pycodestyle error, F: flake8 error, I: isort imports, UP: Upgrade syntax
ignore = ["E501"] #line-too-long. Currently prevents PRs. More effort required to fix across codebase.



[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
