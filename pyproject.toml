[tool.poetry]
name = "katabatic-test"
version = "0.1.0a1"
description = "Framework for synthetic tabular data generation, evaluation, and artifact-based pipelines."
authors = ["Vikum Dabare <vikumdabare@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["synthetic-data", "tabular-data", "generative-models", "GAN", "TSTR"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{ include = "katabatic" }]
include = ["CHANGELOG.md", "LICENSE"]

[tool.poetry.urls]
Homepage = "https://github.com/datascience-works/Katabatic"
Repository = "https://github.com/datascience-works/Katabatic"
Documentation = "https://github.com/datascience-works/Katabatic#readme"
"Bug Tracker" = "https://github.com/datascience-works/Katabatic/issues"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
pandas = "^2.3.1"
scikit-learn = "^1.3.0"
numpy = "^1.24.0"
tensorflow = { version = "==2.19.*", optional = true }
pgmpy = { version = ">=0.1.25", optional = true }
pyitlib = { version = "0.3.1", optional = true }
tf-keras = { version = "^2.19.0", optional = true }
scipy = { version = "^1.13.0,<1.15.0", optional = true }
transformers = { version = "^4.53.2", optional = true }
torch = { version = "^2.7.1", optional = true }
datasets = { version = "^4.0.0", optional = true }
accelerate = { version = ">=0.26.0", optional = true }
xgboost = { version = "^3.0.2", optional = true }
tqdm = { version = "^4.66.0", optional = true }
tomli = { version = "^2.0.1", optional = true }
tomli-w = { version = "^1.0.0", optional = true }
category-encoders = { version = "^2.8.1", optional = true }
rtdl_revisiting_models = { version = "0.0.2", optional = true }

[tool.poetry.extras]
ganblr = ["tensorflow", "pgmpy", "pyitlib", "tf-keras", "scipy", "tqdm"]
great = ["transformers", "torch", "datasets", "accelerate"]
eval = ["xgboost"]
tabddpm = ["torch", "scipy", "rtdl_revisiting_models", "category-encoders"]
pategan = ["tensorflow", "scipy"]
codi = ["torch"]
medgan = ["torch"]
ctgan = ["torch"]
tabsyn = ["torch", "scipy", "tqdm", "category-encoders", "tomli", "tomli-w"]
all = [
    "tensorflow",
    "pgmpy",
    "pyitlib",
    "tf-keras",
    "scipy",
    "transformers",
    "torch",
    "datasets",
    "accelerate",
    "xgboost",
    "tqdm",
    "category-encoders",
    "tomli",
    "tomli-w",
    "rtdl_revisiting_models",
]

[tool.poetry.group.dev.dependencies]
autopep8 = "^2.0.0"
isort = "^5.12.0"
mypy = "^1.5.0"
ruff = "^0.12.4"
ipykernel = "<7"
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"
notebook = "^7.5.6"
jupyterlab = "^4.5.7"

[tool.poetry.scripts]
katabatic = "katabatic.cli.main:main"

[tool.pytest.ini_options]
markers = [
    "integration: full model stack (slow)",
    "ganblr: requires tensorflow extra",
    "great: requires torch/transformers extra",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
