default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

exclude: '^(frontend/|katabatic/models/tabddpm/official/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check --fix
        language: system
        types: [python]
        require_serial: true
        files: '^(katabatic/models/tabddpm/models\.py|benchmarks/examples/tabddpm/run_tabddpm_adult\.py)$'

      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format
        language: system
        types: [python]
        require_serial: true
        files: '^(katabatic/models/tabddpm/models\.py|benchmarks/examples/tabddpm/run_tabddpm_adult\.py)$'

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
