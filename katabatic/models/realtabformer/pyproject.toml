[project]
name = "katabatic-realtabformer"
version = "0.1.0"
description = "Isolated dependencies for the experimental Katabatic REaLTabFormer model."
requires-python = ">=3.11,<3.12"

dependencies = [
    "realtabformer==0.2.4",
    "transformers>=4.57.0,<5.0.0",
    "torch>=2.2,<2.11",
    "huggingface-hub>=0.34.0,<1.0",
    "datasets>=4.0.0,<5.0.0",
    "fsspec>=2023.5.0,<=2026.2.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
