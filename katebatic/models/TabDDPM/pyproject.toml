[project]
name = "tabddpm"
version = "0.1.0"
description = "TabDDPM Setup from Rajat Dulal (s225207935)"
authors = [
    {name = "Rajat-Dulal",email = "rjtdulal@gmail.com"}
]
readme = "README.md"


[tool.poetry.dependencies]
python = ">=3.9.7,<3.10"
catboost = "1.0.3"
category-encoders = "2.3.0"
dython = "0.5.1"
icecream = "2.1.2"
libzero = "0.0.8"
numpy = "1.21.4"
optuna = "2.10.1"
pandas = "1.3.4"
pyarrow = "6.0.0"
rtdl = "0.0.9"
scikit-learn = "1.0.2"
scipy = "1.7.2"
skorch = "0.11.0"
tomli-w = "0.4.0"
tomli = "1.2.2"
tqdm = "4.62.3"
imbalanced-learn = "0.7.0"
rdt = "0.6.4"

[tool.poetry]
packages = [{include = "feature"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
